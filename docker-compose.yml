services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sql_software
    volumes:
      - sql_software_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sql_practice
      PRACTICE_DATABASE_PASSWORD: ${PRACTICE_DATABASE_PASSWORD:-local-only-practice-password}
    ports:
      - "5432:5432"
    volumes:
      - sql_practice_pg:/var/lib/postgresql/data
      - ./backend/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sql_practice"]
      interval: 5s
      timeout: 5s
      retries: 10
  spark_runner:
    image: sql-practice-spark-runner:3.5.6
    build: ./worker/spark
    restart: unless-stopped
    environment:
      SPARK_RUNNER_TOKEN: ${SPARK_RUNNER_TOKEN:-local-development-only-token}
      SPARK_JOB_IMAGE: sql-practice-spark-runner:3.5.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-990}"
    ports:
      - "127.0.0.1:4021:4021"
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4021/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      start_period: 60s
      retries: 3
  python_runner:
    image: sql-practice-python-runner:3.11
    build: ./worker/python
    restart: unless-stopped
    environment:
      PYTHON_RUNNER_TOKEN: ${PYTHON_RUNNER_TOKEN:-local-development-python-token}
      PYTHON_JOB_IMAGE: sql-practice-python-runner:3.11
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-990}"
    ports:
      - "127.0.0.1:4020:4020"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4020/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  sql_software_mongo:
  sql_practice_pg:
