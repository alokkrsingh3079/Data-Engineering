services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sql_practice}
      PRACTICE_DATABASE_PASSWORD: ${PRACTICE_DATABASE_PASSWORD:?Set PRACTICE_DATABASE_PASSWORD}
    volumes:
      - sql_practice_pg:/var/lib/postgresql/data
      - ./backend/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sql_practice}
      PRACTICE_DATABASE_URL: ${PRACTICE_DATABASE_URL:-postgresql://practice_executor:${PRACTICE_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-sql_practice}}
      PRACTICE_DATABASE_ROLE: ${PRACTICE_DATABASE_ROLE:-practice_executor}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-sql_software}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      AUTH_SECRET: ${AUTH_SECRET:?Set a long random AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sqlpractice.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost}
    depends_on:
      postgres: {condition: service_healthy}
    expose: ["4000"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [backend]
volumes:
  sql_practice_pg:
