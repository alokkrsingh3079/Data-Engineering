services:
  - type: web
    name: sql-software-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --prefix backend && npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sql_software
      - key: DATABASE_URL
        sync: false
      - key: PRACTICE_DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PRACTICE_ROLE_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false