name: Deploy AWS Lambda API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      STACK_NAME: data-engineering-practice-prod
      SSM_PARAMETER_PREFIX: /data-engineering/prod/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: aws-actions/setup-sam@v2

      - name: Check repository AWS secrets
        env:
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_ACCESS_KEY" ]; then
            echo "::error::Add ACCESS_KEY and SECRET_ACCESS_KEY under repository Settings > Secrets and variables > Actions > Secrets. Codespaces secrets are not available to Actions."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify required Parameter Store entries
        run: |
          aws ssm get-parameters-by-path \
            --path "$SSM_PARAMETER_PREFIX" \
            --recursive \
            --query 'Parameters[].{Name:Name,Type:Type}' \
            --output json \
            > "$RUNNER_TEMP/ssm-parameters.json"
          for name in MONGODB_URI DATABASE_URL AUTH_SECRET; do
            parameter="$SSM_PARAMETER_PREFIX/$name"
            if ! jq -e --arg name "$parameter" 'any(.[]; .Name == $name and .Type == "SecureString")' "$RUNNER_TEMP/ssm-parameters.json" > /dev/null; then
              echo "::error::Missing required SecureString parameter: $parameter"
              exit 1
            fi
          done
          parameter="$SSM_PARAMETER_PREFIX/ALLOWED_ORIGIN"
          if ! jq -e --arg name "$parameter" 'any(.[]; .Name == $name)' "$RUNNER_TEMP/ssm-parameters.json" > /dev/null; then
            echo "::error::Missing required parameter: $parameter"
            exit 1
          fi

      - name: Build backend and SAM template
        run: |
          npm ci --prefix backend
          npm run build --prefix backend
          sam build --template-file aws/template.yaml --build-dir .aws-sam/build

      - name: Deploy AWS resources
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Run database initialization and migrations
        run: |
          aws lambda invoke \
            --function-name data-engineering-practice-prod-migrate \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            "$RUNNER_TEMP/migration-response.json" \
            > "$RUNNER_TEMP/migration-metadata.json"
          if jq -e 'has("FunctionError")' "$RUNNER_TEMP/migration-metadata.json" > /dev/null; then
            echo "Database initialization failed. The Cloudflare Worker remains pointed at its current API."
            exit 1
          fi

      - name: Verify API health and publish URL
        run: |
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" \
            --output text)"
          curl --fail --silent --show-error --max-time 25 "$API_URL/api/health"
          echo
          echo "AWS API URL: $API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Keep the Cloudflare Worker on its current origin until you have tested login, uploads, and job polling against this API."
